<!-- header.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .vs-navbar {
      background: linear-gradient(90deg, #1cb5e0, #000851);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      padding: 0.7rem 1rem;
      z-index: 999;
      position: relative;
    }

    .vs-brand {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff !important;
    }

    .vs-nav-link {
      font-weight: 500;
      color: #ffffff !important;
      transition: all 0.3s ease-in-out;
    }

    .vs-nav-link:hover {
      color: #f1c40f !important;
      transform: scale(1.05);
    }

    .vs-nav-icon {
      margin-right: 6px;
    }

    .vs-toggler {
      border: none;
    }

    .vs-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='%23fff' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0,0,0,0.5)' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }
    
  /* Prevent overflow */
.dropdown-menu {
    position: absolute !important;
    z-index: 1055;
    transform: translateX(-30%) !important;
}

/* Optional: Add arrow or padding */
.dropdown-menu::before {
    content: "";
    position: absolute;
    top: -8px;
    right: 20px;
    border-width: 0 8px 8px 8px;
    border-style: solid;
    border-color: transparent transparent #ffffff transparent;
}

.navbar {
    z-index: 1056;
}

    
  </style>
</head>
<body>
<div th:fragment="navbar">
  <nav class="navbar navbar-expand-lg vs-navbar">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center vs-brand" href="/">
        <img src="https://cdn-icons-png.flaticon.com/512/743/743007.png" alt="logo" width="35" class="me-2">
        VehicleService
      </a>

      <button class="navbar-toggler vs-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon vs-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item mx-2"><a class="nav-link vs-nav-link" href="#"><i class="bi bi-info-circle vs-nav-icon"></i>About</a></li>
          <li class="nav-item mx-2"><a class="nav-link vs-nav-link" th:href="@{/Userdata/usereg}"><i class="bi bi-person-plus-fill vs-nav-icon"></i>Signup</a></li>
          <li class="nav-item mx-2" th:if="${umail == null}"><a class="nav-link vs-nav-link" th:href="@{/Userdata/log}"><i class="bi bi-box-arrow-in-right vs-nav-icon"></i>Login</a></li>
          <li class="nav-item mx-2"><a class="nav-link vs-nav-link" href="#"><i class="bi bi-telephone-fill vs-nav-icon"></i>Contact</a></li>
         
       <li class="nav-item mx-2" th:if="${uname != null}">
    <a class="nav-link vs-nav-link text-success fw-bold" href="javascript:void(0);" onclick="confirmLogout()">
        <i class="bi bi-box-arrow-in-right vs-nav-icon"></i>Logout
    </a>
</li>
<script>
    // Function to show confirmation popup before logout
    function confirmLogout() {
        if (confirm("Are you sure you want to logout?")) {
            // Redirect to logout URL if confirmed
            window.location.href = '/Userdata/logout';
        }
    }

</script> 


<!-- Profile Icon Dropdown (Only if user is logged in) -->
<li class="nav-item dropdown mx-2" th:if="${uname != null}">
    <a class="nav-link dropdown-toggle text-info fw-bold" href="#" id="profileDropdown"
       role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle fs-4"></i>
    </a>
  <ul class="dropdown-menu dropdown-menu-end p-3 shadow rounded-3"
    aria-labelledby="profileDropdown"
    style="min-width: 250px; max-width: 300px; word-wrap: break-word; right: 0; left: auto;">
    <li class="mb-2"><strong>Name:</strong> <span th:text="${uname}">John Doe</span></li>
    <li class="mb-2"><strong>Email:</strong> <span th:text="${umail}">john@example.com</span></li>
    <li><strong>Phone:</strong> <span th:text="${uphone}">+91-9876543210</span></li>
</ul>



</li>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const dropdown = document.getElementById("profileDropdown");
        if (dropdown) {
            dropdown.parentElement.addEventListener("mouseenter", () => {
                new bootstrap.Dropdown(dropdown).show();
            });
            dropdown.parentElement.addEventListener("mouseleave", () => {
                new bootstrap.Dropdown(dropdown).hide();
            });
        }
    });
</script>



        </ul>
      </div>
    </div>
  </nav>
</div>
</body>
</html>
