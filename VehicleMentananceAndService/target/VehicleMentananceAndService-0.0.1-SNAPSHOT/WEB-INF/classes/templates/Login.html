<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Login Form</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/navbar.css}">
  
  
  <link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script
	src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/jquery.validation/1.19.5/jquery.validate.min.js"></script>
    
  

  <style>
    body {
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', sans-serif;
    }
    .container-box {
      background-color: rgba(255, 255, 255, 0.96);
      padding: 30px;
      border-radius: 10px;
      margin-top: 70px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    }
    .form-heading {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-label {
      font-weight: bold;
      color: #2c3e50;
    }
    .form-control {
      border-radius: 25px;
    }
    .btn-submit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 25px;
      font-weight: bold;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
    }
    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 4px;
    }
    .is-invalid {
      border-color: red;
    }
    @media (max-width: 768px) {
      .side-image {
        display: none;
      }
    }
  </style>

  <!-- jQuery and Validation Plugins -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

  
  <script>

  
  jQuery.validator.addMethod(
    "checkmail",
    function(value, element) {
      return /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(value) 
             || /^[0-9]{10}$/.test(value);
    }
  );

  $(document).ready(function () {
    
    // Form Validation
    $("#loginForm").validate({
      errorClass: "error-message",
      rules: {
        umail: {
          required: true,
          email: true,
          checkmail: true
        },
        upass: {
          required: true,
          minlength: 8,
          maxlength: 8
        },
        captchaInput: {
          required: true
        }
      },
      messages: {
        umail: {
          required: "Please enter your email.",
          email: "Enter a valid email address."
        },
        upass: {
          required: "Please enter your password.",
          minlength: "Password must be exactly 8 characters.",
          maxlength: "Password must not be more than 8 characters."
        },
        captchaInput: {
          required: "Please enter the captcha."
        }
      },
      errorPlacement: function (error, element) {
        error.insertAfter(element);
      },
      highlight: function (element) {
        $(element).addClass('is-invalid');
      },
      unhighlight: function (element) {
        $(element).removeClass('is-invalid').addClass('is-valid');
      }
    });

    // AJAX Email Validation
    $('#umail').keyup(function () {
      var umail = $(this).val();
      $.ajax({
        url: '/Userdata/checkEmail',
        type: 'GET',
        data: { umail: umail },
        success: function (response) {
          if (response === true) {
            $('#codeError').text('Email Registered').css('color', 'green');
          } else {
            $('#codeError').text('Email not registered').css('color', 'red');
          }
        },
        error: function () {
          $('#codeError').text('Error checking email').css('color', 'red');
        }
      });
    });

    // AJAX Password Validation
    $('#upass').keyup(function () {
      var upass = $(this).val();
      $.ajax({
        url: '/Userdata/checkPass',
        type: 'GET',
        data: { upass: upass },
        success: function (responses) {
          if (responses === true) {
            $('#passError').text('Password Registered').css('color', 'green');
          } else {
            $('#passError').text('Password not registered').css('color', 'red');
          }
        },
        error: function () {
          $('#passError').text('Error checking Password').css('color', 'red');
        }
      });
    });

    // Generate Captcha
    generateCaptcha();
  });

  function generateCaptcha() {
    var charsArray = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    var lengthOtp = 5;
    var captcha = [];
    for (var i = 0; i < lengthOtp; i++) {
      var index = Math.floor(Math.random() * charsArray.length);
      captcha.push(charsArray[index]);
    }
    document.getElementById("captchaCode").value = captcha.join("");
  }

  // Captcha Validation on Submit
  $(function() {
    $("#loginForm").on('submit', function (e) {
      var enteredCaptcha = $("#captchaInput").val();
      var actualCaptcha = $("#captchaCode").val();
      if (enteredCaptcha !== actualCaptcha) {
        e.preventDefault();
        $("#captchaError").text("Captcha does not match. Try again!").css('color', 'red');
        generateCaptcha(); // Refresh captcha
      } else {
        $("#captchaError").text("");
      }
    });
  });

  </script>
</head>

<body>

  <!-- Navbar -->
  <div th:replace="~{header :: navbar}"></div>

  <!-- Login Form -->
  <div class="container">
    <div class="row align-items-center justify-content-center">
      <div class="col-lg-6">
        <div class="container-box">
          <div class="form-heading">User Login</div>

          <form th:action="@{/Userdata/loginuser}" id="loginForm" method="post">
            <div class="card-footer bg-info text-white" th:if="${message != null}">
              <h2 style="color: red;" th:text="${message}"></h2>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="text" class="form-control" name="umail" id="umail" placeholder="Enter your email" required>
              <span id="codeError" class="error-message"></span>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="upass" id="upass" placeholder="Enter your password" required>
              <span id="passError" class="error-message"></span>
            </div>

            <!-- Captcha Fields -->
            <div class="mb-3">
              <label class="form-label">Captcha</label>
              <div class="d-flex align-items-center">
                <input type="text" class="form-control me-2" id="captchaCode" name="captchaCode" style="width: 120px;" readonly> 
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="generateCaptcha()">Refresh</button>
              </div>
              <input type="text" class="form-control mt-2" id="captchaInput" name="captchaInput" placeholder="Enter captcha" required>
              <span id="captchaError" class="error-message"></span>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-submit">Login</button>
            </div>

            <h6 class="mt-3 text-center">Don't have an account? <a th:href="@{/Userdata/usereg}">Register here</a></h6>

          </form>
        </div>
      </div>

      <!-- Side Image -->
      <div class="col-lg-5 text-center">
        <img src="https://media.istockphoto.com/id/1346236005/photo/a-man-in-a-suit-shows-the-car-protection-system-icon.jpg?s=612x612&w=0&k=20&c=e9jLfTanA-h1DEi1ohTLFGTGg6Y7vp29rxlhfXzA_G4=" alt="Vehicle Service" class="side-image">
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{footer :: footer}"></div>
  
  <script th:if="${statustype != null}">
  var statusmessage = "[[${statusmessage}]]";
  var statustype = "[[${statustype}]]";

  toastr.options = {
      "closeButton": true,
      "progressBar": true,
      "timeOut": "5000",
      "positionClass": "toast-top-center",
      "newestOnTop": true,
      "preventDuplicates": true
  };
  if (statustype === "success") {
      toastr.success(statusmessage);
  } else if (statustype === "error") {
      toastr.error(statusmessage);
  }
  </script>

</body>
</html>
