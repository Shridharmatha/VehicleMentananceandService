<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Update Vehicle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Header Styles */
    .vs-navbar {
      background: linear-gradient(90deg, #1cb5e0, #000851);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      padding: 0.7rem 1rem;
      z-index: 999;
      position: relative;
    }

    .vs-brand {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff !important;
    }

    .vs-nav-link {
      font-weight: 500;
      color: #ffffff !important;
      transition: all 0.3s ease-in-out;
    }

    .vs-nav-link:hover {
      color: #f1c40f !important;
      transform: scale(1.05);
    }

    .vs-nav-icon {
      margin-right: 6px;
    }

    .vs-toggler {
      border: none;
    }

    .vs-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='%23fff' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0,0,0,0.5)' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* Form Card */
    .update-card {
      max-width: 950px;
      margin: 100px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
      background-color: rgba(255, 255, 255, 0.95);
    }

    .form-section {
      padding: 40px 30px;
    }

    .form-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #007bff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #888;
    }

    .form-control {
      padding-left: 40px;
      height: 45px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }

    .btn-update {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .btn-update:hover {
      background-color: #0056b3;
    }

    .image-section {
      background-image: url('https://wallpapersok.com/images/hd/cool-car-neon-blue-j3a9pqeowr7ywja3.jpg');
      background-size: cover;
      background-position: center;
      min-height: 100%;
    }

    @media (max-width: 768px) {
      .image-section {
        display: none;
      }
    }
  </style>
</head>
<body>

<!-- HEADER NAVBAR -->
<nav class="navbar navbar-expand-lg vs-navbar">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center vs-brand" href="/">
      <img src="https://cdn-icons-png.flaticon.com/512/743/743007.png" alt="logo" width="35" class="me-2">
      VehicleService
    </a>

    <button class="navbar-toggler vs-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon vs-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-center">
        <li class="nav-item mx-2"><a class="nav-link vs-nav-link" href="#"><i class="bi bi-info-circle vs-nav-icon"></i>About</a></li>
        <li class="nav-item mx-2"><a class="nav-link vs-nav-link" th:href="@{/Userdata/usereg}"><i class="bi bi-person-plus-fill vs-nav-icon"></i>Signup</a></li>
        <li class="nav-item mx-2"><a class="nav-link vs-nav-link" th:href="@{/Userdata/log}"><i class="bi bi-box-arrow-in-right vs-nav-icon"></i>Login</a></li>
        <li class="nav-item mx-2"><a class="nav-link vs-nav-link" href="#"><i class="bi bi-telephone-fill vs-nav-icon"></i>Contact</a></li>
        <li class="nav-item mx-2"><a class="nav-link vs-nav-link text-warning fw-bold" href="#"><i class="bi bi-box-arrow-right vs-nav-icon"></i>Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container">
  <div class="row update-card">
    <!-- Car Image -->
    <div class="col-md-6 image-section d-none d-md-block"></div>

    <!-- Update Form -->
    <div class="col-md-6 form-section">
      <div class="form-title text-center">Update Vehicle</div>
      
      <form th:action="@{/vehicle/update}" th:object="${list}" method="post">
        <input type="hidden" th:field="*{vid}" />

        <div class="form-group">
          <i class="bi bi-car-front-fill"></i>
          <input type="text" class="form-control" th:field="*{vehicleNumber}" placeholder="Vehicle Number" required>
        </div>

        <div class="form-group">
          <i class="bi bi-tools"></i>
          <input type="text" class="form-control" th:field="*{model}" placeholder="Vehicle Model" required>
        </div>

        <div class="form-group">
          <i class="bi bi-calendar-event"></i>
          <input type="number" class="form-control" th:field="*{year}" placeholder="Manufacture Year" min="1900" max="2099" required>
        </div>

        <div class="form-group">
          <i class="bi bi-palette-fill"></i>
          <input type="text" class="form-control" th:field="*{color}" placeholder="Color" required>
        </div>

        <div class="d-grid mt-3">
          <button type="submit" class="btn btn-update">Update Vehicle</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
