<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Service Booking</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- jQuery & Validation -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/jquery.validation/1.19.5/jquery.validate.min.js"></script>

  <!-- Toastr Notifications -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/navbar.css}">

  <style>
    body {
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', sans-serif;
    }

    .container-box {
      background-color: rgba(255, 255, 255, 0.96);
      padding: 30px;
      border-radius: 10px;
      margin-top: 50px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    }

    .form-heading {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-label {
      font-weight: bold;
      color: #2c3e50;
    }

    .form-control {
      border-radius: 25px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 25px;
      font-weight: bold;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
    }

    .side-image {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      margin-top: 50px;
    }

    .error-message {
      color: red;
      font-size: 16px;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .side-image {
        display: none;
      }
    }
  </style>

  <script>
    $(document).ready(function () {
      $("#bookingForm").validate({
        errorClass: "error-message",
        rules: {
          customerName: { required: true },
          vehicleNumber: { required: true },
          serviceCenter: { required: true },
          serviceType: { required: true },
          serviceDate: { required: true }
        },
        messages: {
          customerName: { required: "Please enter your name" },
          vehicleNumber: { required: "Please enter vehicle number" },
          serviceCenter: { required: "Please enter service center name" },
          serviceType: { required: "Please specify service type" },
          serviceDate: { required: "Please choose a service date" }
        }
      });
    });
  </script>
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{header :: navbar}"></div>

  <!-- Toastr Alert -->
  <script th:if="${statustype != null}">
    var statusmessage = "[[${statusmessage}]]";
    var statustype = "[[${statustype}]]";
    toastr.options = {
      "closeButton": true,
      "progressBar": true,
      "timeOut": "5000",
      "positionClass": "toast-top-center",
      "newestOnTop": true,
      "preventDuplicates": true
    };
    if (statustype === "success") {
      toastr.success(statusmessage);
    } else if (statustype === "error") {
      toastr.error(statusmessage);
    }
  </script>

  <!-- Main Content -->
  <div class="container">
    <div class="row align-items-center justify-content-center">

      <!-- Booking Form -->
      <div class="col-lg-6">
        <div class="container-box">
          <div class="form-heading">Book a Service</div>
          <form th:action="@{/center/booking}" method="post" id="bookingForm">

            <div class="mb-3">
              <label class="form-label">Customer Name</label>
              <input type="text" class="form-control" name="customerName" th:value="${oname}" readonly>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Customer Mail</label>
              <input type="text" class="form-control" name="email" th:value="${omail}" readonly>
            </div>

            <div class="mb-3">
              <label class="form-label">Vehicle Number</label>
              <input type="text" class="form-control" name="vehicleNumber" th:value="${ownerdata.vehicleNumber}" placeholder="Enter vehicle number" readonly>
            </div>

            <div class="mb-3">
              <label class="form-label">Service Center Name</label>
              <input type="text" class="form-control" name="centerName" th:value="${centername}" readonly>
            </div>

            <div class="form-group">
              <label for="serviceType" class="form-label">Service Type</label>
           <select class="form-control"  id="serviceTypeSelect" name="serviceType">
               <option value="" disabled selected>Select a service</option>
        <option th:each="type : ${serviceTypes}" th:value="${type.Servicename}"   th:data-price="${type.price}" th:text="${type.Servicename}"></option>
    </select>
</div>


            <div class="mb-3">
              <label class="form-label">Preferred Date</label>
              <input type="date" class="form-control" name="serviceDate">
            </div>
            
             <div class="mb-3">
             
              <input type="hidden" class="form-control" name="status" value="Pending" readonly>
            </div>
            
             <div class="mb-3">
              <label class="form-label">Service Cost</label>
              <input type="number" class="form-control" name="cost" value="${price}" id="costInput" readonly >
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-submit">Book Now</button>
            </div>

          </form>
        </div>
      </div>
      
      <!-- JavaScript to Auto-fill Price -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const serviceSelect = document.getElementById('serviceTypeSelect');
    const costInput = document.getElementById('costInput');

    serviceSelect.addEventListener('change', function () {
      const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
      const price = selectedOption.getAttribute('data-price');
      costInput.value = price || '';
    });
  });
</script>

      <!-- Image -->
      <div class="col-lg-5 text-center">
        <img src="https://media.istockphoto.com/id/1946362176/photo/driverless-autonomous-self-driving-artificial-intelligence-lithium-battery-electric-vehicle.jpg?s=612x612&w=0&k=20&c=ySclZdADmpyyNJXGujPEBfkqBdJU4j8w-vQk8sjNQYI=" alt="Service Booking" class="side-image">
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{footer :: footer}"></div>

</body>
</html>
