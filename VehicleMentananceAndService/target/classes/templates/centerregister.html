<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Customer Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/jquery.validation/1.19.5/jquery.validate.min.js"></script>
    <link rel="stylesheet" th:href="@{/navbar.css}">
  
  
    <link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script
	src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/jquery.validation/1.19.5/jquery.validate.min.js"></script>
  

  <style>
    body {
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', sans-serif;
    }

    .container-box {
      background-color: rgba(255, 255, 255, 0.96);
      padding: 30px;
      border-radius: 10px;
      margin-top: 50px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    }

    .form-heading {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-label {
      font-weight: bold;
      color: #2c3e50;
    }

    .form-control {
      border-radius: 25px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 25px;
      font-weight: bold;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
    }

    .side-image {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      margin-top: 50px;
    }

    .error-message {
      color: red;
      font-size: 16px;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .side-image {
        display: none;
      }
    }
  </style>

  <script>
    jQuery.validator.addMethod("checkemail", function (value, element) {
      return /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(value);
    });

    $(document).ready(function () {
      $("#signup").validate({
        errorClass: "error-message",
        rules: {
          cname: { required: true },
          cmail: { required: true, checkemail: true },
          cphone: { required: true, minlength: 10, maxlength: 10, digits: true },
          caddress: { required: true }
        },
        messages: {
          cname: { required: "Please enter the name." },
          cmail: { required: "Please enter email" },
          cphone: { required: "Please enter phone number" },
          caddress: { required: "Please enter address" }
        }
      });

      $('#cmail').keyup(function () {
        var useremail = $(this).val();
        $.ajax({
          url: '/EventManagement/checkEmail',
          type: 'GET',
          data: { useremail: useremail },
          success: function (response) {
            if (response === true || response === "true") {
              $('#codeError').text('Email can be used').css('color', 'green');
            } else {
              $('#codeError').text('Email already taken').css('color', 'red');
            }
          },
          error: function () {
            $('#codeError').text('Error occurred while checking email');
          }
        });
      });
    });
  </script>
</head>

<body>
  <!-- Navbar -->
  <div th:replace="~{header :: navbar}"></div>
  
  <script th:if="${statustype != null}">
                var statusmessage = "[[${statusmessage}]]";
                var statustype = "[[${statustype}]]";

                toastr.options = {
                    "closeButton": true,
                    "progressBar": true,
                    "timeOut": "5000",
                    "positionClass": "toast-top-center",
                    "newestOnTop": true,
                    "preventDuplicates": true
                };
                if (statustype === "success") {
                    toastr.success(statusmessage);
                } else if (statustype === "error") {
                    toastr.error(statusmessage);
                }
            </script>

  <!-- Page Content -->
  <div class="container">
    <div class="row align-items-center justify-content-center">

      <!-- Registration Form -->
      <div class="col-lg-6">
        <div class="container-box">
          <div class="form-heading">Service Center Registration Form</div>
          <form th:action="@{/center/cregister}" id="signup" method="post" enctype="multipart/form-data">
            
            <!-- Optional success message -->
            <div class="card-footer bg-info text-white" th:if="${message != null}">
              <h2 style="color: red;" th:text="${message}"></h2>
            </div>

            <!-- cname -->
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" name="cname" id="cname" placeholder="Enter your name" required>
            </div>

            <!-- cphone -->
            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="text" class="form-control" name="cphone" id="cphone" placeholder="Enter phone number" required>
            </div>

            <!-- cmail -->
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="text" class="form-control" name="cmail" id="cmail" placeholder="Enter email" required>
              <span id="codeError" class="error-message"></span>
            </div>

            <!-- caddress -->
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" rows="3" name="caddress" id="caddress" placeholder="Enter your address" required></textarea>
            </div>

            <!-- cimg -->
            <div class="mb-3">
              <label class="form-label">Upload Image</label>
              <input type="text" class="form-control" name="cimg" id="cimg" placeholder="Enter your image URL or path">
            </div>

            <!-- Submit Button -->
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-submit">Register Now</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Right-side Image -->
      <div class="col-lg-5 text-center">
        <img src="https://media.istockphoto.com/id/1946362176/photo/driverless-autonomous-self-driving-artificial-intelligence-lithium-battery-electric-vehicle.jpg?s=612x612&w=0&k=20&c=ySclZdADmpyyNJXGujPEBfkqBdJU4j8w-vQk8sjNQYI=" alt="Vehicle Service" class="side-image">
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{footer :: footer}"></div>
</body>
</html>
