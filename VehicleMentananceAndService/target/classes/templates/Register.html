<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/navbar.css}">
  <style>
    body {
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', sans-serif;
    }

    .container-box {
      background-color: rgba(255, 255, 255, 0.96);
      padding: 30px;
      border-radius: 10px;
      margin-top: 50px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    }

    .form-heading {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-label {
      font-weight: bold;
      color: #2c3e50;
    }

    .form-control {
      border-radius: 25px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 25px;
      font-weight: bold;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
    }

    .side-image {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      margin-top: 50px;
    }

    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 4px;
    }

    .is-invalid {
      border-color: red;
    }

    @media (max-width: 768px) {
      .side-image {
        display: none;
      }
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script>
    // jQuery validation setup
    jQuery.validator
			.addMethod(
					"checkmail",
					function(value, element) {
						return /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(value)|| /^[0-9]{10}$/.test(value);
					});
    $(document).ready(function($) {
      $("#signup").validate({
        errorClass: "error-message", // Error message class
        validClass: "valid", // To handle valid class (optional)
        rules: {
          uname: {
            required: true
          },
          umail: {
            required: true,
            checkmail: true
          },
          uphone: {
            required: true,
            digits: true, // Add this line
            minlength: 10,
            maxlength: 10
          },
          upass: {
            required: true,
            minlength: 8
          },
          cupass: {
            required: true,
            minlength: 8,
            equalTo: "#upass"
          }
        },
        messages: {
          uname: {
            required: "Please enter your name."
          },
          umail: {
            required: "Please enter your email.",
            email: "Enter a valid email."
          },
          uphone: {
            required: "Please enter your phone number.",
            digits: "Phone number must contain only digits.",
            minlength: "Phone number must be 10 digits.",
            maxlength: "Phone number cannot exceed 10 digits."
          },
          upass: {
            required: "Please enter a password.",
            minlength: "Password must be at least 8 characters."
          },
          cupass: {
            required: "Please confirm your password.",
            equalTo: "Passwords do not match."
          }
        },
        errorPlacement: function(error, element) {
          // This places the error message after the input field
          error.insertAfter(element);
        },
        highlight: function(element, errorClass, validClass) {
          $(element).addClass('is-invalid'); // Add Bootstrap's invalid class for styling
          $(element).removeClass('is-valid'); // Remove Bootstrap's valid class
        },
        unhighlight: function(element, errorClass, validClass) {
          $(element).removeClass('is-invalid'); // Remove invalid class
          $(element).addClass('is-valid'); // Add valid class
        }
      });

      // AJAX email validation
      $('#umail').keyup(function () {
        var umail = $(this).val();
        $.ajax({
          url: '/Userdata/checkEmail',
          type: 'GET',
          data: { umail: umail },
          success: function (response) {
            if (response === true) {
              $('#codeError').text('Email already taken').css('color', 'red');
            } else {
              $('#codeError').text('Email can be used').css('color', 'rgb(27, 165, 27)');
            }
          },
          error: function () {
            $('#codeError').text('Error occurred while checking email');
          }
        });
      });
    });
  </script>
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{header :: navbar}"></div>

  <!-- Page Content -->
  <div class="container">
    <div class="row align-items-center justify-content-center">
      <!-- Registration Form -->
      <div class="col-lg-6">
        <div class="container-box">
          <div class="form-heading">User Registration Form</div>
          <form th:action="@{/Userdata/uregister}" id="signup" method="post">
            <div class="card-footer bg-info text-white" th:if="${message != null}">
              <h2 style="color: red;" th:text="${message}"></h2>
            </div>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" name="uname" id="uname" placeholder="Enter your name" required>
              <span class="error-message"></span>
            </div>

            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="text" class="form-control" name="uphone" id="uphone" placeholder="Enter phone number" pattern="^[0-9]{10}$" required>
              <span class="error-message"></span>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="text" class="form-control" name="umail" id="umail" placeholder="Enter email" required>
              <span id="codeError" class="error-message"></span> <!-- Email error message -->
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="upass" id="upass" placeholder="Choose password" required>
              <span class="error-message"></span>
            </div>

            <div class="mb-3">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" name="cupass" id="cupass" placeholder="Confirm password" required>
              <span class="error-message"></span>
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" rows="3" name="uaddress" id="uaddress" placeholder="Enter your address" required></textarea>
              <span class="error-message"></span>
            </div>
            
             <div class="mb-3">
              <label class="form-label">Address</label>
              <input class="form-control" type="text" name="uroll" id="uroll" placeholder="Enter your uroll" required>
              <span class="error-message"></span>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-submit">Register Now</button>
            </div>
            <h6>Do you already have an account? <a th:href="@{/Userdata/log}">Login here</a></h6>

          </form>
        </div>
      </div>

      <!-- Vehicle Image -->
      <div class="col-lg-5 text-center">
        <img src="https://media.istockphoto.com/id/1346236005/photo/a-man-in-a-suit-shows-the-car-protection-system-icon.jpg?s=612x612&w=0&k=20&c=e9jLfTanA-h1DEi1ohTLFGTGg6Y7vp29rxlhfXzA_G4=" alt="Vehicle Service" class="side-image">
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{footer :: footer}"></div>

</body>
</html>
