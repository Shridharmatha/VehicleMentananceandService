<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Vehicle Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/jquery.validation/1.19.5/jquery.validate.min.js"></script>
    <link rel="stylesheet" th:href="@{/navbar.css}">
  
  
    <link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script
	src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/jquery.validation/1.19.5/jquery.validate.min.js"></script>
  
  <style>
    body {
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', sans-serif;
    }

    .container-box {
      background-color: rgba(255, 255, 255, 0.96);
      padding: 30px;
      border-radius: 10px;
      margin-top: 50px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    }

    .form-heading {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-label {
      font-weight: bold;
      color: #2c3e50;
    }

    .form-control {
      border-radius: 25px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 25px;
      font-weight: bold;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
    }

    .side-image {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      margin-top: 50px;
    }

    .error-message {
      color: red;
      font-size: 16px;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .side-image {
        display: none;
      }
    }
  </style>

  <script>
    $(document).ready(function () {
      $("#vehicleForm").validate({
        errorClass: "error-message",
        rules: {
          vehicleNumber: { required: true },
          model: { required: true },
          year: {
            required: true,
            digits: true,
            min: 1900,
            max: 2099
          },
          color: { required: true }
        },
        messages: {
          vehicleNumber: { required: "Please enter vehicle number" },
          model: { required: "Please enter model" },
          year: {
            required: "Please enter year",
            digits: "Year must be a number",
            min: "Year must be after 1900",
            max: "Year must be before 2100"
          },
          color: { required: "Please enter color" }
        }
      });
    });
  </script>
 
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{header :: navbar}"></div>
  
  <script th:if="${statustype != null}">
                var statusmessage = "[[${statusmessage}]]";
                var statustype = "[[${statustype}]]";

                toastr.options = {
                    "closeButton": true,
                    "progressBar": true,
                    "timeOut": "5000",
                    "positionClass": "toast-top-center",
                    "newestOnTop": true,
                    "preventDuplicates": true
                };
                if (statustype === "success") {
                    toastr.success(statusmessage);
                } else if (statustype === "error") {
                    toastr.error(statusmessage);
                }
            </script>


  <!-- Page Content -->
  <div class="container">
    <div class="row align-items-center justify-content-center">

      <!-- Vehicle Form -->
      <div class="col-lg-6">
        <div class="container-box">
          <div class="form-heading">Vehicle Registration Form</div>
          <form th:action="@{/vehicle/vehiclereg}" id="vehicleForm" method="post">

            <div class="card-footer bg-info text-white" th:if="${message != null}">
              <h2 style="color: red;" th:text="${message}"></h2>
            </div>

            <div class="mb-3">
              <label class="form-label">Vehicle Number</label>
              <input type="text" class="form-control" name="vehicleNumber" id="vehicleNumber" placeholder="Enter vehicle number">
            </div>
            
             <div class="mb-3">
              <label class="form-label">Owner Name</label>
              <input type="text" class="form-control" name="ownername" id="ownername" placeholder="Enter vehicle number">
            </div>

            <div class="mb-3">
              <label class="form-label">Model</label>
              <input type="text" class="form-control" name="model" id="model" placeholder="Enter model">
            </div>

            <div class="mb-3">
              <label class="form-label">Manufacturing Year</label>
              <input type="number" class="form-control" name="year" id="year" placeholder="e.g. 2022">
            </div>

            <div class="mb-3">
              <label class="form-label">Color</label>
              <input type="text" class="form-control" name="color" id="color" placeholder="Enter color">
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-submit">Register Vehicle</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Image Column -->
      <div class="col-lg-5 text-center">
        <img src="https://media.istockphoto.com/id/1946362176/photo/driverless-autonomous-self-driving-artificial-intelligence-lithium-battery-electric-vehicle.jpg?s=612x612&w=0&k=20&c=ySclZdADmpyyNJXGujPEBfkqBdJU4j8w-vQk8sjNQYI=" alt="Vehicle Service" class="side-image">
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{footer :: footer}"></div>

</body>
</html>
