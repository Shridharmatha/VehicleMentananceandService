<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>All Vehicle Service Centers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/navbar.css}">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
    }

    main {
      flex: 1;
    }

    .page-title {
      text-align: center;
      color: #fff;
      font-size: 36px;
      margin: 40px 0 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }

    .search-bar {
      position: relative;
    }

    .search-bar input {
      padding-left: 40px;
      border-radius: 30px;
      border: none;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .search-bar i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #999;
    }

    .center-card {
      background: linear-gradient(135deg, #ffffff, #f9f9f9);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      margin-bottom: 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .center-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .center-image {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background-color: #f2f2f2;
      border-bottom: 1px solid #ddd;
    }

    .center-body {
      padding: 20px;
    }

    .center-body h5 {
      color: #2c3e50;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .center-body p {
      margin: 5px 0;
      color: #555;
    }

    .btn-book {
      margin-top: 15px;
      background: linear-gradient(135deg, #007bff, #00c6ff);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 600;
      box-shadow: 0 5px 15px rgba(0,123,255,0.4);
      transition: all 0.3s ease;
    }

    .btn-book:hover {
      background: linear-gradient(135deg, #0056b3, #00aaff);
      box-shadow: 0 8px 20px rgba(0,123,255,0.6);
      transform: translateY(-2px);
    }

    .pagination {
      justify-content: center;
      margin-top: 30px;
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 26px;
      }
    }

    @media (max-width: 576px) {
      .center-body h5 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{header :: navbar}"></div>

  <!-- Toast Message -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div class="toast align-items-center text-white bg-success border-0" role="alert" id="successToast" th:if="${statustype == 'success'}">
      <div class="d-flex">
        <div class="toast-body">
          <span th:text="${statusmessage}">Registered Successfully</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container">
    <div class="page-title">All Vehicle Service Centers</div>

    <!-- Search and Items Per Page Select -->
    <div class="d-flex justify-content-center align-items-center flex-wrap mb-4 gap-3">
      <div class="search-bar">
        <i class="bi bi-search"></i>
        <input type="text" class="form-control" placeholder="Search service centers..." id="searchInput">
      </div>
      <div class="text-white fw-bold">
        Items per page:
        <select id="itemsPerPage" class="form-select d-inline-block w-auto ms-2">
          <option value="4">4</option>
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="1000">All</option>
        </select>
      </div>
    </div>

    <!-- No Results Message -->
    <p id="noResults" class="text-center text-white fw-bold" style="display: none;">No matching service centers found.</p>

    <!-- Center Cards -->
    <div class="row" id="centerContainer">
      <div class="col-md-6 center-card-item"
           th:each="center, iterStat : ${list}"
           th:attr="data-search=${center.cname + ' ' + center.cmail + ' ' + center.caddress}">
        <div class="center-card">
          <img th:src="${center.cimg}" alt="Center Image" class="center-image"
               onerror="this.src='https://via.placeholder.com/300x180';">
          <div class="center-body">
            <h5 th:text="${center.cname}">Center Name</h5>
            <p><strong>Phone:</strong> <span th:text="${center.cphone}">1234567890</span></p>
            <p><strong>Email:</strong> <span th:text="${center.cmail}">abc@example.com</span></p>
            <p><strong>Address:</strong> <span th:text="${center.caddress}">Some Address</span></p>
            <a class="btn btn-book mt-3" th:href="@{'/center/booking/' + ${center.cid}}">Book Now</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <nav>
      <ul class="pagination" id="pagination"></ul>
    </nav>
  </main>

  <!-- Footer -->
  <div th:replace="~{footer :: footer}"></div>

  <!-- Bootstrap & Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toastEl = document.getElementById('successToast');
    if (toastEl) new bootstrap.Toast(toastEl).show();

    const searchInput = document.getElementById("searchInput");
    const cards = document.querySelectorAll(".center-card-item");
    const noResults = document.getElementById("noResults");
    const pagination = document.getElementById("pagination");
    const itemsPerPageSelect = document.getElementById("itemsPerPage");

    let currentPage = 1;
    let pageSize = parseInt(itemsPerPageSelect.value);
    let filteredCards = Array.from(cards);

    function renderCards() {
      cards.forEach(card => card.style.display = "none");
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      filteredCards.slice(start, end).forEach(card => {
        card.style.display = "block";
      });
      noResults.style.display = filteredCards.length === 0 ? "block" : "none";
      renderPagination();
    }

    function renderPagination() {
      const pageCount = Math.ceil(filteredCards.length / pageSize);
      pagination.innerHTML = "";
      if (pageCount <= 1) return;

      for (let i = 1; i <= pageCount; i++) {
        const li = document.createElement("li");
        li.className = `page-item ${i === currentPage ? "active" : ""}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        li.addEventListener("click", (e) => {
          e.preventDefault();
          currentPage = i;
          renderCards();
        });
        pagination.appendChild(li);
      }
    }

    searchInput.addEventListener("input", () => {
      const filter = searchInput.value.toLowerCase();
      filteredCards = Array.from(cards).filter(card =>
        card.getAttribute("data-search").toLowerCase().includes(filter)
      );
      currentPage = 1;
      renderCards();
    });

    itemsPerPageSelect.addEventListener("change", () => {
      pageSize = parseInt(itemsPerPageSelect.value);
      currentPage = 1;
      renderCards();
    });

    window.addEventListener("DOMContentLoaded", renderCards);
  </script>
</body>
</html>
