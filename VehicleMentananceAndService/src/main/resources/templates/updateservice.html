<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Update Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Segoe UI', sans-serif;
    }

    .vs-navbar {
      background: linear-gradient(90deg, #1cb5e0, #000851);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      padding: 0.7rem 1rem;
    }

    .vs-brand {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff !important;
    }

    .update-card {
      max-width: 800px;
      margin: 80px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
      background-color: rgba(255, 255, 255, 0.95);
    }

    .form-section {
      padding: 40px 30px;
    }

    .form-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #007bff;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #888;
    }

    .form-control {
      padding-left: 40px;
      height: 45px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }

    .btn-update {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-weight: bold;
      width: 100%;
    }

    .btn-update:hover {
      background-color: #0056b3;
    }

    .image-section {
      background-image: url('https://wallpapersok.com/images/hd/cool-car-neon-blue-j3a9pqeowr7ywja3.jpg');
      background-size: cover;
      background-position: center;
    }

    @media (max-width: 768px) {
      .image-section {
        display: none;
      }
    }
  </style>
</head>
<body>

<!-- HEADER NAVBAR -->
<nav class="navbar navbar-expand-lg vs-navbar">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center vs-brand" href="/">
      <img src="https://cdn-icons-png.flaticon.com/512/743/743007.png" alt="logo" width="35" class="me-2">
      VehicleService
    </a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container">
  <div class="row update-card">
    <!-- Optional Image -->
    <div class="col-md-6 image-section d-none d-md-block"></div>

    <!-- Update Form -->
    <div class="col-md-6 form-section">
      <div class="form-title text-center">Update Service</div>

      <form th:action="@{/center/serviceupdate}" th:object="${list}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
          <i class="bi bi-gear-fill"></i>
          <input type="text" class="form-control" th:field="*{Servicename}" placeholder="Service Name" required>
        </div>

        <div class="form-group">
          <i class="bi bi-currency-rupee"></i>
          <input type="number" step="0.01" class="form-control" th:field="*{price}" placeholder="Price" required>
        </div>

        <div class="form-group">
          <i class="bi bi-check-circle-fill"></i>
          <input type="text" class="form-control" th:field="*{status}" placeholder="Status" required>
        </div>

        <button type="submit" class="btn btn-update mt-3">Update Service</button>
      </form>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div th:replace="~{footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
