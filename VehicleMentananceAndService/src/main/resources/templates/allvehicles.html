<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>All Vehicles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/navbar.css}">

  <!-- jQuery & Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Toastr -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .content {
      flex: 1;
      padding: 40px 15px;
    }

    .container-box {
      background-color: rgba(255, 255, 255, 0.96);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    }

    .page-title {
      font-size: 32px;
      text-align: center;
      margin-bottom: 25px;
      font-weight: bold;
      color: #2c3e50;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    }

    .table th, .table td {
      vertical-align: middle;
    }

    .btn-action {
      border-radius: 20px;
      padding: 6px 16px;
      font-weight: 500;
    }

    .btn-update {
      background-color: #17a2b8;
      color: white;
    }

    .btn-delete {
      background-color: #dc3545;
      color: white;
    }

    .btn-update:hover {
      background-color: #138496;
    }

    .btn-delete:hover {
      background-color: #c82333;
    }

    footer {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      padding: 15px 0;
    }
  </style>
</head>
<body>
<div class="main-wrapper">

  <!-- Navbar -->
  <div th:replace="~{header :: navbar}"></div>

  <!-- Toast Script -->
  <script th:if="${statustype != null}">
    var statusmessage = "[[${statusmessage}]]";
    var statustype = "[[${statustype}]]";
    toastr.options = {
      "closeButton": true,
      "progressBar": true,
      "timeOut": "5000",
      "positionClass": "toast-top-center",
      "newestOnTop": true,
      "preventDuplicates": true
    };
    if (statustype === "success") {
      toastr.success(statusmessage);
    } else if (statustype === "error") {
      toastr.error(statusmessage);
    }
  </script>

  <!-- Content -->
  <div class="content">
    <div class="container">
      <div class="container-box">
        <div class="page-title">All Registered Vehicles</div>

        <div class="table-responsive">
          <table id="vehicleTable" class="table table-bordered table-hover table-striped">
            <thead class="table-dark">
              <tr>
                <th>Vehicle ID</th>
                  <th>Owner Name</th>
                <th>Vehicle Number</th>
                <th>Model</th>
                <th>Year</th>
                <th>Color</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="vehicle : ${list}">
                <td th:text="${vehicle.vid}"></td>
                  <td th:text="${vehicle.ownername}"></td>
                <td th:text="${vehicle.vehicleNumber}"></td>
                <td th:text="${vehicle.model}"></td>
                <td th:text="${vehicle.year}"></td>
                <td th:text="${vehicle.color}"></td>
                <td>
                  <a th:href="@{'/vehicle/edit/' + ${vehicle.vid}}" class="btn btn-action btn-update me-2">Update</a>
                  <a th:href="@{'/vehicle/delete/' + ${vehicle.vid}}" class="btn btn-action btn-delete"
                     onclick="return confirm('Are you sure you want to delete this vehicle?')">Delete</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer th:replace="~{footer :: footer}">
    <p>&copy; 2025 Vehicle Service Portal. All rights reserved.</p>
  </footer>

</div>

<!-- DataTables Initialization -->
<script>
  $(document).ready(function () {
    $('#vehicleTable').DataTable();
  });
</script>

</body>
</html>
