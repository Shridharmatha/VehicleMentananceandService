<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Bookings</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/navbar.css}">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  
  <link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script
	src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/jquery.validation/1.19.5/jquery.validate.min.js"></script>
  
  

  <style>
    body {
      background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230407/pngtree-blue-background-illustrations-royalty-free-vector-graphics-wallpape-image_2225611.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', sans-serif;
    }

    .container-box {
      background-color: rgba(255, 255, 255, 0.96);
      padding: 30px;
      border-radius: 12px;
      margin-top: 60px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
    }

    .table thead {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-accept {
      background-color: #28a745;
      color: white;
    }

    .btn-reject {
      background-color: #dc3545;
      color: white;
    }

    .btn-complete {
      background-color: #007bff;
      color: white;
    }

    .btn-accept:hover, .btn-reject:hover, .btn-complete:hover {
      opacity: 0.85;
    }

    .form-heading {
      font-size: 26px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 25px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .table-responsive {
        font-size: 14px;
      }
    }
  </style>

  <script>
    function confirmAction(action, formId) {
      Swal.fire({
        title: 'Are you sure?',
        text: `You want to ${action} this booking.`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: action === 'accept' ? '#28a745' : (action === 'reject' ? '#dc3545' : '#007bff'),
        cancelButtonColor: '#6c757d',
        confirmButtonText: `Yes, ${action} it!`
      }).then((result) => {
        if (result.isConfirmed) {
          document.getElementById(formId).submit();
        }
      });
    }
  </script>
</head>

<body>

  <!-- Navbar -->
  <div th:replace="~{header :: navbar}"></div>

  <!-- Content -->
  <div class="container">
    <div class="container-box">
      <div class="form-heading">Service Bookings</div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped text-center align-middle">
          <thead>
            <tr>
              <th>Service ID</th>
              <th>Customer Name</th>
              <th>Vehicle Number</th>
              <th>Service Center</th>
              <th>Service Type</th>
              <th>Preferred Date</th>
              <th>Status</th>
              <th>Cost</th>
              <th th:if="${isAdmin}">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="booking : ${list}">
              <td th:text="${booking.sid}"></td>
              <td th:text="${booking.customerName}"></td>
              <td th:text="${booking.vehicleNumber}"></td>
              <td th:text="${booking.centerName}"></td>
              <td th:text="${booking.serviceType}"></td>
              <td th:text="${booking.serviceDate}"></td>
              <td>
                <span th:text="${booking.status}"
                      th:classappend=" ${booking.status == 'Pending'} ? 'badge bg-warning text-dark' :
                                      (${booking.status == 'Accepted'} ? 'badge bg-success' :
                                      (${booking.status == 'Rejected'} ? 'badge bg-danger' :
                                      (${booking.status == 'Completed'} ? 'badge bg-primary' : 'badge bg-secondary')))">
                </span>
              </td>
              <td th:text="${booking.cost}"></td>
              <td th:if="${isAdmin}">
                <!-- Accept Form -->
                <form th:action="@{'/center/accept/' + ${booking.sid}}" method="post" th:id="'acceptForm-' + ${booking.sid}">
                  <button type="button"
                          class="btn btn-accept btn-sm mb-1"
                          th:onclick="'confirmAction(\'accept\', \'acceptForm-' + ${booking.sid} + '\')'"
                          th:disabled="${booking.status != 'Pending'}">
                    Accept
                  </button>
                </form>

                <!-- Reject Form -->
                <form th:action="@{'/center/reject/' + ${booking.sid}}" method="post" th:id="'rejectForm-' + ${booking.sid}">
                  <button type="button"
                          class="btn btn-reject btn-sm mb-1"
                          th:onclick="'confirmAction(\'reject\', \'rejectForm-' + ${booking.sid} + '\')'"
                          th:disabled="${booking.status != 'Pending'}">
                    Reject
                  </button>
                </form>

                <!-- Complete Form -->
                <form th:action="@{'/center/complete/' + ${booking.sid}}" method="post" th:id="'completeForm-' + ${booking.sid}">
                  <button type="button"
                          class="btn btn-complete btn-sm"
                          th:onclick="'confirmAction(\'complete\', \'completeForm-' + ${booking.sid} + '\')'"
                          th:disabled="${booking.status != 'Accepted'}">
                    Completed
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(list)}">
              <td th:colspan="${isAdmin} ? 9 : 8" class="text-center">No bookings found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{footer :: footer}"></div>
  
  <script th:if="${statustype != null}">
  var statusmessage = "[[${statusmessage}]]";
  var statustype = "[[${statustype}]]";

  toastr.options = {
      "closeButton": true,
      "progressBar": true,
      "timeOut": "5000",
      "positionClass": "toast-top-center",
      "newestOnTop": true,
      "preventDuplicates": true
  };
  if (statustype === "success") {
      toastr.success(statusmessage);
  } else if (statustype === "error") {
      toastr.error(statusmessage);
  }
  </script>

</body>
</html>
